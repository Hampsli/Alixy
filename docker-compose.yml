services:
  backend:
    build:
      context: ./alixy-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
    ports:
      - "3001:3000"
    environment:
      # Browser hits backend through host port; same-origin not required
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
